name: release

# Three entry points. Every push to `main` reads the version from
# orca-plugin.json and stops there if `v<version>` already exists. Otherwise
# it checks the commit (`quality`, `build`), then `tag` creates `v<version>`
# and dispatches this workflow at it; nothing is published in that run.
#
# A pushed `v*` tag tests the commit and packs its source as a tarball
# (`git archive` of the tagged commit, which is what Orca installs), plus
# the catalog `releases` entry from `orca-ide plugin release-entry`. The
# publishing run attests the tarball's build provenance and attaches the
# tarball, its Sigstore bundle, release-entry.json and the checksums to a
# GitHub Release. Nothing goes to npm. Manual dispatch retries an existing
# tag without moving it; always dispatch at the tag so provenance records it:
#   gh workflow run release.yml --ref vX.Y.Z -f tag=vX.Y.Z
# Re-runs are idempotent: an existing GitHub Release only gets its assets
# refreshed.
#
# Prerequisites (configure once each, outside this repo):
#   - Actions → General → "Workflow permissions" allows id-token writes
#     (required to sign the provenance attestation).
#   - `main` is protected: a pull request with a required review and the
#     required CI check.
#   - A tag ruleset on `refs/tags/v*` blocks update and deletion, so a
#     release tag never moves or disappears. Creation stays open because a
#     repository ruleset cannot list the GitHub Actions app as a bypass
#     actor, and the `tag` job creates tags with GITHUB_TOKEN. A hand-made
#     tag still has to pass the gates below.
# A workflow can never be its own root of trust: whoever can merge to
# `main` or push a `v*` tag controls these guards, so the protection must
# live in the repository settings, outside the repo's files.

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to retry
        required: true
        type: string

permissions: {}

jobs:
  # On a push to main: is orca-plugin.json's version untagged? Reads through
  # the API, so no repository code runs here.
  pending:
    name: pending version
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      due: ${{ steps.check.outputs.due }}
    steps:
      - name: Find an untagged orca-plugin.json version
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(gh api "repos/$GITHUB_REPOSITORY/contents/orca-plugin.json?ref=$GITHUB_SHA" --jq .content | base64 -d | jq -r .version)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::orca-plugin.json version '$version' is not semver"
            exit 1
          fi
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>/dev/null; then
            echo "$tag already exists; nothing to release."
            echo "due=false" >> "$GITHUB_OUTPUT"
          else
            echo "due=true" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: test and typecheck
    needs: pending
    # Tag push and dispatch skip `pending`; a push to main runs only when a release is due.
    if: ${{ !cancelled() && (needs.pending.result == 'skipped' || needs.pending.outputs.due == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || needs.pending.outputs.tag && github.sha || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - uses: ./.github/actions/setup-orca
      - run: npm ci --ignore-scripts
      # tsconfig.json extends .orca/types/tsconfig.json, which this generates.
      - run: orca-ide plugin types .
      - run: npm run typecheck
      - run: orca-ide plugin test .
      - name: Check editor/dist matches a fresh build (new files included)
        run: |
          npm run build
          git status --porcelain -- editor/dist
          test -z "$(git status --porcelain -- editor/dist)"
      - run: orca-ide plugin validate .

  build:
    needs: [pending, quality]
    if: ${{ !cancelled() && needs.quality.result == 'success' }}
    name: pack and verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # History for the tag ancestry check.
          fetch-depth: 0
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || needs.pending.outputs.tag && github.sha || github.ref }}
          persist-credentials: false

      - name: Verify tag (gate)
        if: ${{ !needs.pending.outputs.tag }}
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse "refs/tags/$RELEASE_TAG^{}")" = "$(git rev-parse HEAD)" ]
          git merge-base --is-ancestor HEAD origin/main
          pkg_version=$(jq -r .version orca-plugin.json)
          [ "$(jq -r .version package.json)" = "$pkg_version" ]
          if [ "$RELEASE_TAG" != "v$pkg_version" ]; then
            echo "Tag $RELEASE_TAG is not v + orca-plugin.json version $pkg_version"
            exit 1
          fi

      # Push to main: the tag does not exist yet, so check the commit and version instead.
      - name: Verify untagged main commit (gate)
        if: ${{ needs.pending.outputs.tag }}
        env:
          RELEASE_TAG: ${{ needs.pending.outputs.tag }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          git merge-base --is-ancestor HEAD origin/main
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "$RELEASE_TAG already exists"
            exit 1
          fi
          pkg_version=$(jq -r .version orca-plugin.json)
          [ "$(jq -r .version package.json)" = "$pkg_version" ]
          if [ "$RELEASE_TAG" != "v$pkg_version" ]; then
            echo "Tag $RELEASE_TAG is not v + orca-plugin.json version $pkg_version"
            exit 1
          fi

      # The pack needs only git and orca-ide; no dependencies are installed.
      - uses: ./.github/actions/setup-orca

      - name: Read tag metadata
        id: meta
        env:
          RELEASE_TAG: ${{ inputs.tag || needs.pending.outputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      # Pack the committed source, the files Orca installs from the tag, and
      # record the catalog entry for the same commit.
      - name: Pack
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          mkdir -p artifacts
          git archive --format=tar.gz --prefix="orca-phpantom-$version/" -o "artifacts/orca-phpantom-$version.tar.gz" HEAD
          orca-ide plugin release-entry . --json | jq .result.entry > artifacts/release-entry.json
          [ "$(jq -r .commit artifacts/release-entry.json)" = "$(git rev-parse HEAD)" ]
          cat artifacts/release-entry.json
          echo "##[group]Tarball contents"
          tar -tzf "artifacts/orca-phpantom-$version.tar.gz" | sort
          echo "##[endgroup]"

      - name: Generate SHA-256 checksums
        run: |
          cd artifacts
          sha256sum -- *.tar.gz release-entry.json > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-artifact
          path: artifacts/
          if-no-files-found: error

  # Tags the pre-checked commit and starts the publishing run at the tag, so
  # provenance records refs/tags/v<version>. A GITHUB_TOKEN dispatch starts a
  # run; a GITHUB_TOKEN tag push would not.
  tag:
    name: tag and dispatch release
    needs: [pending, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.pending.outputs.due == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - name: Create v<version> and dispatch release.yml at it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.pending.outputs.tag }}
        run: |
          set -euo pipefail
          repo="repos/$GITHUB_REPOSITORY"
          if gh api "$repo/git/ref/tags/$TAG" --silent 2>/dev/null; then
            tagged=$(gh api "$repo/commits/$TAG" --jq .sha)
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG already points at $tagged, not $GITHUB_SHA"
              exit 1
            fi
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "$TAG is already released."
              exit 0
            fi
            active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --branch "$TAG" --event workflow_dispatch \
              --json status --jq '[.[] | select(.status != "completed")] | length')
            if [ "$active" != "0" ]; then
              echo "A release run for $TAG is already in progress."
              exit 0
            fi
          else
            object=$(gh api "$repo/git/tags" -f tag="$TAG" -f message="$TAG" \
              -f object="$GITHUB_SHA" -f type=commit --jq .sha)
            gh api "$repo/git/refs" -f ref="refs/tags/$TAG" -f sha="$object" --silent
          fi
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f tag="$TAG"
          echo "Dispatched release.yml at $TAG."

  publish:
    needs: build
    # The push to main only pre-checks; the run it dispatches at the tag publishes.
    if: ${{ !cancelled() && needs.build.result == 'success' && !(github.event_name == 'push' && github.ref_type == 'branch') }}
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # `gh release --target main` needs the repo, but no credentials
          # are persisted after this step.
          fetch-depth: 0
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Re-verify tag still points at this commit
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse "refs/tags/$RELEASE_TAG^{}")" = "$(git rev-parse HEAD)" ]

      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifact
          path: artifacts

      # Integrity handoff: the artifact must still match the checksum
      # generated next to the build, byte for byte.
      - name: Verify artifact checksums
        working-directory: artifacts
        run: |
          set -euo pipefail
          sha256sum --check checksums-sha256.txt

      # The attested tarball and its Sigstore bundle are attached to the
      # GitHub Release.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*.tar.gz

      # Idempotent: on a re-run the release already exists, so only its
      # assets are refreshed.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::$tag release already exists; refreshing assets only"
          else
            gh release create "$tag" --title "$tag" --target main --generate-notes
          fi
          set -- artifacts/*.tar.gz
          [ "$#" -eq 1 ]
          cp "$BUNDLE_PATH" "$1.intoto.jsonl"
          gh release upload "$tag" "$1" "$1.intoto.jsonl" artifacts/release-entry.json artifacts/checksums-sha256.txt --clobber

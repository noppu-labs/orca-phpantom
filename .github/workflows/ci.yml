name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: lint, format, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - uses: ./.github/actions/setup-orca
      - run: npm ci --ignore-scripts
      - run: orca-ide plugin types .
      - run: npm run fmt:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Check editor/dist matches a fresh build (new files included)
        run: |
          npm run build
          git status --porcelain -- editor/dist
          test -z "$(git status --porcelain -- editor/dist)"
      - run: orca-ide plugin validate .
      - run: orca-ide plugin check .
      - run: orca-ide plugin test .
      - name: Download and run the real PHPantom release
        run: PHPANTOM_INTEGRATION=1 orca-ide plugin test .

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      # A bump here changes editor/dist. Check out the branch, run npm run build, commit the result.
      editor-bundle:
        patterns:
          - 'esbuild'
          - 'monaco-editor'
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
        exclude-patterns:
          - 'esbuild'
          - 'monaco-editor'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - '*'
